name: setup-and-smoke-test
# Run manually from the Actions tab: "prefetch" downloads all model weights into the Modal cache volume once;
# "film" renders a short real documentary end to end on Modal GPUs and prints the timings.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "prefetch or film"
        required: true
        default: "prefetch"
        type: choice
        options: [prefetch, film]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run on Modal
        env:
          RAW_ID: ${{ secrets.MODAL_TOKEN_ID }}
          RAW_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TASK: ${{ inputs.task }}
        run: |
          BOTH="$RAW_ID $RAW_SECRET"
          export MODAL_TOKEN_ID="$(printf '%s' "$BOTH" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          export MODAL_TOKEN_SECRET="$(printf '%s' "$BOTH" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          if [ "$TASK" = "prefetch" ]; then
            modal run docugen/modal_app.py::prefetch
          else
            modal run docugen/modal_app.py --topic "The rise of India's UPI" --seconds 30 --scenes 3 --motion 1
          fi
