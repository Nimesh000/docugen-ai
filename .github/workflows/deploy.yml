name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Deploy to Modal
        env:
          RAW_ID: ${{ secrets.MODAL_TOKEN_ID }}
          RAW_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$RAW_ID" ]; then
            echo "::notice::Add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET as repository secrets to auto-deploy to your Modal account."
            exit 0
          fi
          # tolerate pasted quotes, spaces, "MODAL_TOKEN_ID=" / "token_id = " prefixes, or both values in one secret
          BOTH="$RAW_ID $RAW_SECRET"
          export MODAL_TOKEN_ID="$(printf '%s' "$BOTH" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          export MODAL_TOKEN_SECRET="$(printf '%s' "$BOTH" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Could not find an 'ak-...' token id and an 'as-...' token secret in the MODAL_TOKEN_ID / MODAL_TOKEN_SECRET secrets."
            exit 1
          fi
          modal deploy docugen/modal_app.py
